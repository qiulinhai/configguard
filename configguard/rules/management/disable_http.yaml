id: CISCO-MGMT-002
name: Disable HTTP Server
category: management-plane
severity: HIGH

applies_to:
  category:
    - http

match:
  type: regex
  pattern: "HTTP_ENABLED"

condition: present

finding:
  status: FAIL
  evidence: true

description: >
  HTTP server exposes management interface to network attacks.

remediation: >
  Use 'no ip http server' to disable and use SSH for management.

references:
  - type: cis-benchmark
    id: "2.2.1"
    url: "https://www.cisecurity.org/benchmark/cisco_ios"
  - type: cisco-hardening-guide
    id: "Disabling the HTTP Server"
    url: "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/sec-mgmt/sec-mgmt-book/sec-cfg-sec.html"