id: CISCO-AUTH-001b
name: AAA Disabled
category: authentication
severity: HIGH

applies_to:
  category:
    - aaa

match:
  type: regex
  pattern: "no aaa new-model"

condition: present

finding:
  status: FAIL
  evidence: true

description: >
  AAA has been explicitly disabled with 'no aaa new-model'.
  This is a security risk - AAA should be enabled.

remediation: >
  Configure 'aaa new-model' to enable AAA.

references:
  - type: cis-benchmark
    id: "1.1.1"
    url: "https://www.cisecurity.org/benchmark/cisco_ios"
  - type: nist-800-53
    id: "AC-2"
    url: "https://csrc.nist.gov/Projects/risk-management/sp800-53-controls/release-search"
  - type: cisco-hardening-guide
    id: "Enabling AAA"
    url: "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/security/a1/sec-a1-cr-book/sec-cr-a1.html"