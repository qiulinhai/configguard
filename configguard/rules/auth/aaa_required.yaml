id: CISCO-AUTH-001
name: AAA Required
category: authentication
severity: HIGH

applies_to:
  category:
    - aaa

match:
  type: regex
  pattern: "AAA_MISSING"

condition: present

finding:
  status: FAIL
  evidence: true

description: >
  AAA (Authentication, Authorization, Accounting) must be configured.
  Device has no AAA configuration.

remediation: >
  Configure 'aaa new-model' to enable AAA.