id: CISCO-AUTH-001
name: AAA Required
category: authentication
severity: HIGH

applies_to:
  category:
    - aaa

match:
  type: regex
  pattern: "AAA_MISSING"

condition: present

finding:
  status: FAIL
  evidence: true

description: >
  AAA (Authentication, Authorization, Accounting) must be configured.
  Device has no AAA configuration.

remediation: >
  Configure 'aaa new-model' to enable AAA.

references:
  - type: cis-benchmark
    id: "1.1.1"
    url: "https://www.cisecurity.org/benchmark/cisco_ios"
  - type: nist-800-53
    id: "AC-2"
    url: "https://csrc.nist.gov/Projects/risk-management/sp800-53-controls/release-search"