name: ConfigGuard CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Verify signal extraction
        run: |
          python3 -c "
          from configguard.parser import CiscoIOSParser
          from configguard.signals import SignalExtractor
          config = '''hostname Router1
!
line vty 0 4
 transport input telnet ssh
 login local
!
interface GigabitEthernet0/0
 no shutdown
!
end
'''
          ir = CiscoIOSParser(config).parse()
          sigs = SignalExtractor().extract(ir)
          assert len(sigs) > 0, 'No signals extracted'
          types = {s.type for s in sigs}
          assert 'transport_input' in types, f'Missing transport_input signal, got: {types}'
          print(f'Signal extraction verified: {len(sigs)} signals, types: {types}')
          "

      - name: Run tests
        run: pytest tests/ -v

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.txt
