[project]
name = "configguard"
version = "0.1.0"
description = "CIS-aligned Cisco IOS configuration auditor that runs in your CI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "cisco",
    "cisco-ios",
    "configuration-audit",
    "config-audit",
    "security-hardening",
    "cis-benchmark",
    "network-security",
    "router-config",
    "devsecops",
    "static-analysis",
    "cli",
]
authors = [
    { name = "Lhqiu", email = "lhqiu@example.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/qiulinhai/configguard"
Repository = "https://github.com/qiulinhai/configguard"
Issues = "https://github.com/qiulinhai/configguard/issues"
Changelog = "https://github.com/qiulinhai/configguard/blob/main/CHANGELOG.md"

[project.scripts]
configguard = "configguard.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["configguard"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
